name: ez_db_utility
description: "ezDBUtility - High-Performance Cross-Platform xBase Database Manager"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ===========================================================================
  # Dependency Lock Standard: EXACT VERSIONS ONLY (Strictly NO '^' symbol)
  # ===========================================================================
  ffi: 2.2.0
  path: 1.9.1
  ini: 2.1.0
  flutter_svg: 2.0.10+1
  device_info_plus: 12.4.0
  path_provider: 2.1.6
  devicelocale: 0.9.0
  cached_network_image: 3.4.1
  intl: 0.19.0
  desktop_drop: 0.4.4  
  window_manager: 0.3.9
  file_picker: 8.1.7
  
dev_dependencies:
  flutter_lints: 3.0.0

flutter:
  uses-material-design: true

  # Asset Directories Configuration
  assets:
    - assets/icons/    
    - assets/images/
    - assets/language/